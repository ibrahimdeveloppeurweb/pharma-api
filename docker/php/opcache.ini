; OPcache pour le serveur PHP intégré (SAPI CLI) : désactivé par défaut, ce qui obligeait à recompiler tout
; Symfony à CHAQUE requête (~1 s par appel API). Actif, les requêtes passent à quelques dizaines de ms.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
; Les modifications de code sont reprises au plus tard après 2 secondes (développement)
opcache.validate_timestamps=1
opcache.revalidate_freq=2
realpath_cache_size=4096K
realpath_cache_ttl=600
