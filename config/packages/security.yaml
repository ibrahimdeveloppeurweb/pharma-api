security:
    # 🔐 Gestion du hashage des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # 👤 Provider utilisateur (chargement via entité User)
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Security\User
                property: email

    firewalls:
        # 🔧 Firewall du profiler Symfony (dev uniquement)
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 🔑 Firewall pour la connexion (tu veux que ça passe par ton controller)
        login:
            pattern: ^/api/v1/auth/login
            stateless: true
            security: false  # ✅ On autorise l’accès direct au controller

            # ❌ On commente json_login car il intercepte la requête avant ton controller
            # json_login:
            #     check_path: /api/v1/auth/login
            #     username_path: email
            #     password_path: password
            #     success_handler: lexik_jwt_authentication.handler.authentication_success
            #     failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # 🧾 Firewall pour l'inscription (accès public)
        register:
            pattern: ^/api/v1/auth/register
            stateless: true
            security: false

        # 🧱 Firewall pour toutes les routes API protégées
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    # 🧭 Règles d’accès
    access_control:
        # Routes publiques
      #  - { path: ^/    , roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/edit/password, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/public/pharmacie/new, roles: PUBLIC_ACCESS }

        # Routes sécurisées (JWT requis)
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

# ⚙️ Configuration spécifique aux tests
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # pour bcrypt
                time_cost: 3 # pour argon2
                memory_cost: 10 # pour argon2
